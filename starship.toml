format = """
$character\
$directory\
$git_branch\
$git_status"""

add_newline = false

[character]
success_symbol = "[➜](bold #859900) "
error_symbol = "[➜](bold #dc322f) "

[directory]
truncation_length = 1
read_only = ' [🔒](bold #dc322f)'
style = "bold #268bd2"

[git_branch]
symbol = "git"
format = '[$symbol:\([$branch](bold #b58900)\)](bold #268bd2) '

[git_status]
style = "bold #d33682"
